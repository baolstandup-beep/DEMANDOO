<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demandoo — Devenir Chauffeur Partenaire</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container" style="max-width: 600px;">
    <header>
      <div class="logo">
        <div class="logo-badge">D</div>
        <div>
          <h1>Demandoo</h1>
          <p class="subtitle">Rejoignez notre flotte de chauffeurs</p>
        </div>
      </div>
    </header>

    <div id="alert-container"></div>

    <!-- FORMULAIRE D'INSCRIPTION AUTOMATIQUE -->
    <div class="card">
      <h2 class="card-title">
        <span>📝</span> Inscription Conducteur
      </h2>
      <form id="driver-form">
        <div class="form-row">
          <div class="form-group">
            <label for="prenom">Prénom *</label>
            <input type="text" id="prenom" required placeholder="Moussa">
          </div>
          <div class="form-group">
            <label for="nom">Nom *</label>
            <input type="text" id="nom" required placeholder="Diop">
          </div>
        </div>

        <div class="form-group">
          <label for="telephone">Téléphone *</label>
          <input type="tel" id="telephone" required placeholder="+221 77 000 00 00">
        </div>

        <div class="form-group">
          <label for="email">Adresse Email</label>
          <input type="email" id="email" placeholder="moussa@example.com">
        </div>

        <div class="form-group">
          <label for="permis_numero">N° Permis de conduire *</label>
          <input type="text" id="permis_numero" required placeholder="SN-2024-998877">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="vehicule_type">Type Véhicule *</label>
            <select id="vehicule_type" required>
              <option value="voiture">Voiture</option>
              <option value="moto">Moto</option>
              <option value="camionnette">Camionnette</option>
              <option value="camion">Camion</option>
            </select>
          </div>

          <div class="form-group">
            <label for="ville">Ville / Zone *</label>
            <input type="text" id="ville" required placeholder="Dakar">
          </div>
        </div>

        <div class="form-group">
          <label for="permis_file">Photo / Scan du Permis (Optionnel)</label>
          <input type="file" id="permis_file" accept="image/*,.pdf">
        </div>

        <button type="submit" class="btn">S'inscrire</button>
      </form>
    </div>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
