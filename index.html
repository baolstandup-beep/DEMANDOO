<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Zoom autorisé (WCAG 1.4.4) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#183e94" />

    <title>Demandoo — Covoiturage de confiance au Sénégal (Touba, Dakar, Thiès…)</title>
    <meta name="description" content="Demandoo, le covoiturage de confiance depuis Touba vers tout le Sénégal : Dakar, Thiès, Saint-Louis, Mbour. Trouvez un trajet avec un chauffeur vérifié et contactez-le directement." />
    <link rel="canonical" href="https://demandoo-kappa.vercel.app/" />

    <!-- Partage (WhatsApp, Facebook, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Demandoo" />
    <meta property="og:locale" content="fr_SN" />
    <meta property="og:url" content="https://demandoo-kappa.vercel.app/" />
    <meta property="og:title" content="Demandoo — Covoiturage de confiance au Sénégal" />
    <meta property="og:description" content="Depuis Touba, trouvez votre trajet partout au Sénégal avec des chauffeurs vérifiés." />
    <meta property="og:image" content="https://demandoo-kappa.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Voiture Demandoo et application de covoiturage, de Touba à Dakar" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Demandoo — Covoiturage de confiance au Sénégal" />
    <meta name="twitter:description" content="Depuis Touba, trouvez votre trajet partout au Sénégal avec des chauffeurs vérifiés." />
    <meta name="twitter:image" content="https://demandoo-kappa.vercel.app/og-image.jpg" />

    <!-- Données structurées -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://demandoo-kappa.vercel.app/#organization",
            "name": "Demandoo",
            "url": "https://demandoo-kappa.vercel.app/",
            "logo": "https://demandoo-kappa.vercel.app/icon-512.png",
            "areaServed": { "@type": "Country", "name": "Sénégal" }
          },
          {"@type": "FAQPage", "@id": "https://demandoo-kappa.vercel.app/#faq", "mainEntity": [{"@type": "Question", "name": "Faut-il un compte pour chercher un trajet ?", "acceptedAnswer": {"@type": "Answer", "text": "Non. Les passagers cherchent un trajet et contactent le chauffeur sans créer de compte."}}, {"@type": "Question", "name": "Comment contacter un chauffeur ?", "acceptedAnswer": {"@type": "Answer", "text": "Depuis la fiche du trajet, appelez le chauffeur ou écrivez-lui sur WhatsApp en un clic."}}, {"@type": "Question", "name": "Demandoo réserve-t-il ma place ?", "acceptedAnswer": {"@type": "Answer", "text": "Non. Demandoo met en relation : confirmez directement avec le chauffeur qu’une place est disponible."}}, {"@type": "Question", "name": "Comment se passe le paiement ?", "acceptedAnswer": {"@type": "Answer", "text": "Aucun paiement en ligne pour les passagers. Vous réglez le chauffeur selon votre accord : espèces, Wave ou Orange Money."}}, {"@type": "Question", "name": "Comment proposer un trajet ?", "acceptedAnswer": {"@type": "Answer", "text": "Cliquez sur « Devenir chauffeur », faites vérifier votre profil, puis publiez votre trajet en quelques minutes."}}]},
          {
            "@type": "WebSite",
            "@id": "https://demandoo-kappa.vercel.app/#website",
            "name": "Demandoo",
            "url": "https://demandoo-kappa.vercel.app/",
            "inLanguage": "fr-SN",
            "publisher": { "@id": "https://demandoo-kappa.vercel.app/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://demandoo-kappa.vercel.app/trajets?destination={destination}",
              "query-input": "required name=destination"
            }
          }
        ]
      }
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Demandoo" />

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Image du hero chargée en priorité (LCP) -->
    <link rel="preload" as="image" href="/images/demandoo-car-app.png" fetchpriority="high" />
    <!-- Le CSS Leaflet est importé par les composants carte (bundle), plus besoin d'unpkg -->
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-demandoo-500 selection:text-white">
    <noscript>
      <p style="padding:16px;font-family:sans-serif">Demandoo nécessite JavaScript. Activez-le pour rechercher un trajet.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
